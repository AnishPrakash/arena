name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Format check
        run: test -z "$(gofmt -s -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Architecture rules
        run: ./scripts/check-arch.sh
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - name: Unit tests
        run: go test ./... -race -count=1
      - name: Build
        run: make build
