name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Format check
        run: test -z "$(gofmt -s -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Architecture rules
        run: ./scripts/check-arch.sh
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - name: Unit tests
        run: go test ./... -race -count=1
      - name: Build
        run: make build

  integration:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Bring up the stack
        run: |
          cp .env.example .env
          sudo mkdir -p /var/tmp/arena-blobs && sudo chmod 0777 /var/tmp/arena-blobs
          make images
          docker compose -f deploy/docker-compose.yml up -d
          for i in $(seq 1 60); do
            curl -sf localhost:8080/readyz && exit 0
            sleep 2
          done
          echo "::error::/readyz never became healthy"
          docker compose -f deploy/docker-compose.yml ps
          exit 1

      - name: Seed the demo contest
        run: |
          docker compose -f deploy/docker-compose.yml run --rm seed
          curl -sf localhost:8080/v1/contests/technovit-speed/problems | jq -e 'length > 0'

      - name: Golden judge-the-judge suite
        run: go test ./testdata/golden -tags=golden -v -count=1 -timeout=15m

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
