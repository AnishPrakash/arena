# Overlay for a public host:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Postgres, Redis, Prometheus and Grafana are reachable only on the compose network.
# The cloud firewall is the second layer of this, not the only one — an unauthenticated
# Redis on a public IP is found by scanners within minutes.
services:
  postgres:   { ports: [] }
  redis:      { ports: [] }
  prometheus: { ports: [] }
  grafana:    { ports: [] }
