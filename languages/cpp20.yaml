# file: languages/cpp20.yaml
id: cpp20
display: "C++20 (GCC 13)"
image: arena/cpp20:local
source_file: main.cpp
compile:
  - g++
  - -std=c++20
  - -O2
  - -static          # no dynamic loader ⇒ works on a read-only rootfs, steadier timings
  - -pipe
  - -w
  - -o
  - /box/prog
  - /box/main.cpp
run: ["/box/prog"]
time_multiplier: 1.0
memory_overhead_mb: 0
env: ["LANG=C.UTF-8", "TZ=UTC"]
enabled: true
